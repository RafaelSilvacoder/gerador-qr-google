<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Placa de Avaliação 10x15</title>
  
  <!-- Fonte para destacar o nome da empresa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #eef2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; justify-content: space-between; }
    
    .painel-controle { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 420px; width: 100%; margin-bottom: 25px; }
    h2 { color: #1a73e8; margin-top: 0; font-size: 20px; text-align: center; }
    label { font-weight: bold; font-size: 13px; color: #333; display: block; margin-top: 12px; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn-acao { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    .btn-acao.baixar { background-color: #34a853; }
    .btn-acao.baixar:hover { background-color: #2d8e47; }

    /* Proporção 10x15cm (300px x 450px) */
    .preview-container { display: flex; justify-content: center; width: 100%; flex-grow: 1; }
    .placa-10x15 { width: 300px; height: 450px; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 22px 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }

    /* MODELO 1: PRETO / PREMIUM */
    .theme-dark { background-color: #0d0d0d; color: white; text-align: center; }
    .theme-dark .empresa-nome { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; color: #d4af37; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; word-break: break-word; line-height: 1.2; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 8px; width: 100%; }
    .theme-dark .title { font-size: 16px; font-weight: 300; }
    .theme-dark .google-logo { font-size: 32px; font-weight: 600; font-family: Arial, sans-serif; letter-spacing: -1px; margin-top: -2px; }
    .theme-dark .stars { color: #f4c430; font-size: 20px; letter-spacing: 2px; margin: 4px 0; }
    .theme-dark .scan-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #d4af37; font-weight: 600; margin-bottom: 4px; }
    .theme-dark .qr-box { background: white; padding: 8px; border-radius: 8px; border: 2px solid #d4af37; display: flex; justify-content: center; align-items: center; width: 135px; height: 135px; }
    .theme-dark .footer-text { font-size: 12px; font-style: italic; color: #e0e0e0; font-family: 'Georgia', serif; margin-bottom: 5px; }

    /* MODELO 2: BRANCO / MINIMALISTA CORRIGIDO */
    .theme-light { background-color: #ffffff; color: #333; text-align: center; }
    .theme-light .empresa-nome { font-family: 'Montserrat', sans-serif; font-size: 19px; font-weight: 800; color: #202124; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; word-break: break-word; line-height: 1.2; border-bottom: 2px solid #f1f3f4; padding-bottom: 8px; width: 100%; }
    .theme-light .g-icon { width: 36px; height: 36px; margin-bottom: 2px; }
    .theme-light .stars { color: #fbbc05; font-size: 20px; letter-spacing: 2px; margin: 2px 0 6px 0; }
    .theme-light .title-light { font-size: 15px; font-weight: 600; color: #5f6368; }
    .theme-light .google-text { font-size: 28px; font-weight: bold; letter-spacing: -1px; margin-bottom: 8px; }
    .theme-light .qr-border { padding: 5px; border-radius: 12px; background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc05, #34a853); display: inline-block; }
    .theme-light .qr-inner { background: white; padding: 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; width: 125px; height: 138px; }
    .theme-light .scan-text { font-size: 11px; font-weight: bold; color: #5f6368; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .theme-light .color-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; display: flex; }
    .theme-light .bar-blue { width: 25%; background-color: #4285f4; }
    .theme-light .bar-red { width: 25%; background-color: #ea4335; }
    .theme-light .bar-yellow { width: 25%; background-color: #fbbc05; }
    .theme-light .bar-green { width: 25%; background-color: #34a853; }

    /* Cores do Google */
    .g-blue { color: #4285f4; }
    .g-red { color: #ea4335; }
    .g-yellow { color: #fbbc05; }
    .g-green { color: #34a853; }

    /* Rodapé da Página Web */
    footer { margin-top: 30px; font-size: 14px; color: #555; text-align: center; }
    footer a { color: #1a73e8; text-decoration: none; font-weight: bold; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="painel-controle">
    <h2>Gerador de Placa Google (10x15)</h2>
    
    <label for="nomeEmpresa">Nome da Empresa (Opcional):</label>
    <input type="text" id="nomeEmpresa" placeholder="Ex: PADARIA LG" oninput="atualizarLayout()">

    <label for="placeId">Place ID da Empresa:</label>
    <input type="text" id="placeId" placeholder="Cole o Place ID aqui...">

    <label for="templateSelect">Escolha o Modelo de Placa:</label>
    <select id="templateSelect" onchange="trocarModelo()">
      <option value="light">Modelo 1: Fundo Branco (Minimalista)</option>
      <option value="dark">Modelo 2: Fundo Preto (Premium)</option>
    </select>

    <button id="btnPrincipal" class="btn-acao" onclick="processarPlaca()">Gerar Placa 10x15</button>
  </div>

  <div class="preview-container">
    <div id="placaArea" class="placa-10x15 theme-light"></div>
  </div>

  <footer>
    Desenvolvido por <a href="https://www.instagram.com/rafasonnedev" target="_blank">Rafael Silva</a>
  </footer>

  <script>
    let linkAvaliacao = "";
    let placaPronta = false;

    function renderDark() {
      const empresa = document.getElementById('nomeEmpresa').value.trim();
      const placa = document.getElementById('placaArea');
      placa.className = "placa-10x15 theme-dark";
      
      const topoEmpresa = empresa ? `<div class="empresa-nome">${empresa}</div>` : '';

      placa.innerHTML = `
        <div style="width: 100%;">
          ${topoEmpresa}
          <div class="title">Nos avalie no</div>
          <div class="google-logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
          </div>
          <div class="stars">★ ★ ★ ★ ★</div>
        </div>
        
        <div style="display: flex; flex-direction: column; align-items: center;">
          <span class="scan-label">Escaneie aqui</span>
          <div class="qr-box" id="qrContainer"></div>
        </div>

        <div class="footer-text">
          Sua opinião é muito<br>importante para nós!
        </div>
      `;
    }

    function renderLight() {
      const empresa = document.getElementById('nomeEmpresa').value.trim();
      const placa = document.getElementById('placaArea');
      placa.className = "placa-10x15 theme-light";
      
      const topoEmpresa = empresa ? `<div class="empresa-nome">${empresa}</div>` : '';

      placa.innerHTML = `
        <div style="width: 100%;">
          ${topoEmpresa}
          <div class="title-light">Nos avalie no</div>
          <div class="google-text">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
          </div>
          <div class="stars">★ ★ ★ ★ ★</div>
        </div>

        <div class="qr-border">
          <div class="qr-inner">
            <div class="scan-text">Escaneie</div>
            <div id="qrContainer"></div>
          </div>
        </div>

        <div style="height: 10px;"></div>

        <div class="color-bar">
          <div class="bar-blue"></div>
          <div class="bar-red"></div>
          <div class="bar-yellow"></div>
          <div class="bar-green"></div>
        </div>
      `;
    }

    function desenharQRCode() {
      const container = document.getElementById('qrContainer');
      if (!container || !linkAvaliacao) return;
      container.innerHTML = "";
      
      const modelo = document.getElementById('templateSelect').value;
      const tamanho = modelo === 'dark' ? 118 : 102;

      new QRCode(container, {
        text: linkAvaliacao,
        width: tamanho,
        height: tamanho,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function atualizarLayout() {
      const modelo = document.getElementById('templateSelect').value;
      if (modelo === 'dark') {
        renderDark();
      } else {
        renderLight();
      }
      if (placaPronta) {
        desenharQRCode();
      }
    }

    function trocarModelo() {
      atualizarLayout();
    }

    function processarPlaca() {
      const btn = document.getElementById('btnPrincipal');

      if (placaPronta) {
        baixarPDF();
        return;
      }

      const placeId = document.getElementById('placeId').value.trim();
      if (!placeId) {
        alert('Por favor, digite o Place ID!');
        return;
      }

      linkAvaliacao = `https://search.google.com/local/writereview?placeid=${placeId}`;
      placaPronta = true;
      
      atualizarLayout();

      btn.textContent = "Baixar Placa em PDF (10x15 cm)";
      btn.classList.add("baixar");
    }

    function baixarPDF() {
      const placa = document.getElementById('placaArea');
      
      html2canvas(placa, { 
        scale: 4, 
        useCORS: true, 
        logging: false 
      }).then(canvas => {
        const imgData = canvas.toDataURL('image/png', 1.0);
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: [100, 150]
        });

        pdf.addImage(imgData, 'PNG', 0, 0, 100, 150);
        pdf.save('placa-google-10x15cm.pdf');
      });
    }

    // Inicializa no modelo light
    renderLight();
  </script>
</body>
</html>
