<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Placa de Avaliação 10x15</title>
  <!-- Biblioteca para converter HTML em Imagem alta resolução -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Biblioteca para gerar QR Code via Canvas nativo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #eef2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; justify-content: space-between; }
    
    .content-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }

    .painel-controle { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 420px; width: 100%; margin-bottom: 25px; }
    h2 { color: #1a73e8; margin-top: 0; font-size: 20px; text-align: center; }
    label { font-weight: bold; font-size: 13px; color: #333; display: block; margin-top: 12px; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn-acao { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    .btn-acao.baixar { background-color: #34a853; }
    .btn-acao.baixar:hover { background-color: #2d8e47; }

    /* Proporção 10x15cm (300px x 450px no ecrã) */
    .preview-container { display: flex; justify-content: center; width: 100%; margin-bottom: 30px; }
    .placa-10x15 { width: 300px; height: 450px; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 25px 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }

    /* MODELO 1: PRETO / PREMIUM */
    .theme-dark { background-color: #0d0d0d; color: white; text-align: center; }
    .theme-dark .title { font-size: 20px; margin-top: 10px; font-weight: 300; }
    .theme-dark .google-logo { font-size: 38px; font-weight: 600; font-family: Arial, sans-serif; letter-spacing: -1px; margin-top: -5px; }
    .theme-dark .stars { color: #f4c430; font-size: 24px; letter-spacing: 2px; margin: 10px 0; }
    .theme-dark .qr-box { background: white; padding: 8px; border-radius: 8px; border: 2px solid #d4af37; display: flex; justify-content: center; align-items: center; width: 140px; height: 140px; }
    .theme-dark .footer-text { font-size: 14px; font-style: italic; color: #e0e0e0; font-family: 'Georgia', serif; margin-bottom: 10px; }

    /* MODELO 2: BRANCO / MINIMALISTA */
    .theme-light { background-color: #ffffff; color: #333; text-align: center; }
    .theme-light .g-icon { width: 45px; height: 45px; margin-top: 5px; }
    .theme-light .stars { color: #f4c430; font-size: 22px; letter-spacing: 2px; margin: 5px 0 10px 0; }
    .theme-light .title-light { font-size: 18px; font-weight: bold; color: #202124; margin-bottom: -2px; }
    .theme-light .google-text { font-size: 32px; font-weight: bold; letter-spacing: -1px; margin-bottom: 10px; }
    .theme-light .qr-border { padding: 8px; border-radius: 12px; background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc05, #34a853); display: inline-block; }
    .theme-light .qr-inner { background: white; padding: 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; width: 130px; height: 145px; }
    .theme-light .scan-text { font-size: 13px; font-weight: bold; color: #202124; margin-bottom: 4px; }
    .theme-light .color-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 12px; display: flex; }
    .theme-light .bar-blue { width: 25%; background-color: #4285f4; }
    .theme-light .bar-red { width: 25%; background-color: #ea4335; }
    .theme-light .bar-yellow { width: 25%; background-color: #fbbc05; }
    .theme-light .bar-green { width: 25%; background-color: #34a853; }

    /* Cores do Google */
    .g-blue { color: #4285f4; }
    .g-red { color: #ea4335; }
    .g-yellow { color: #fbbc05; }
    .g-green { color: #34a853; }

    /* Rodapé da Aplicação */
    footer { text-align: center; padding: 15px; font-size: 14px; color: #555; }
    footer a { color: #1a73e8; text-decoration: none; font-weight: bold; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="content-wrap">
    <div class="painel-controle">
      <h2>Gerador de Placa Google (10x15)</h2>
      
      <label for="placeId">Place ID da Empresa:</label>
      <input type="text" id="placeId" placeholder="Cole o Place ID aqui...">

      <label for="templateSelect">Escolha o Modelo de Placa:</label>
      <select id="templateSelect" onchange="trocarModelo()">
        <option value="dark">Modelo 1: Fundo Preto (Premium)</option>
        <option value="light">Modelo 2: Fundo Branco (Minimalista)</option>
      </select>

      <button id="btnPrincipal" class="btn-acao" onclick="processarPlaca()">Gerar Placa 10x15</button>
    </div>

    <div class="preview-container">
      <div id="placaArea" class="placa-10x15 theme-dark"></div>
    </div>
  </div>

  <footer>
    Desenvolvido por <a href="https://instagram.com/rafasonnedev" target="_blank" rel="noopener noreferrer">Rafael Silva</a>
  </footer>

  <script>
    let linkAvaliacao = "";
    let placaPronta = false;

    function renderDark() {
      const placa = document.getElementById('placaArea');
      placa.className = "placa-10x15 theme-dark";
      placa.innerHTML = `
        <div>
          <div class="title">Nos avalie no</div>
          <div class="google-logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
          </div>
          <div class="stars">★ ★ ★ ★ ★</div>
        </div>
        
        <div class="qr-box" id="qrContainer"></div>

        <div class="footer-text">
          Sua opinião é muito<br>importante para nós!
        </div>
      `;
    }

    function renderLight() {
      const placa = document.getElementById('placaArea');
      placa.className = "placa-10x15 theme-light";
      placa.innerHTML = `
        <div>
          <svg class="g-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <div class="stars">★ ★ ★ ★ ★</div>
          <div class="title-light">Nos avalie no</div>
          <div class="google-text">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
          </div>
        </div>

        <div class="qr-border">
          <div class="qr-inner">
            <div class="scan-text">Escaneie</div>
            <div id="qrContainer"></div>
          </div>
        </div>

        <div style="height: 15px;"></div>

        <div class="color-bar">
          <div class="bar-blue"></div>
          <div class="bar-red"></div>
          <div class="bar-yellow"></div>
          <div class="bar-green"></div>
        </div>
      `;
    }

    function desenharQRCode() {
      const container = document.getElementById('qrContainer');
      if (!container || !linkAvaliacao) return;
      container.innerHTML = "";
      
      const modelo = document.getElementById('templateSelect').value;
      const tamanho = modelo === 'dark' ? 124 : 108;

      new QRCode(container, {
        text: linkAvaliacao,
        width: tamanho,
        height: tamanho,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function atualizarLayout() {
      const modelo = document.getElementById('templateSelect').value;
      if (modelo === 'dark') {
        renderDark();
      } else {
        renderLight();
      }
      if (placaPronta) {
        desenharQRCode();
      }
    }

    function trocarModelo() {
      atualizarLayout();
    }

    function processarPlaca() {
      const btn = document.getElementById('btnPrincipal');

      if (placaPronta) {
        baixarImagem();
        return;
      }

      const placeId = document.getElementById('placeId').value.trim();
      if (!placeId) {
        alert('Por favor, digite o Place ID!');
        return;
      }

      linkAvaliacao = `https://search.google.com/local/writereview?placeid=${placeId}`;
      placaPronta = true;
      
      atualizarLayout();

      btn.textContent = "Baixar Imagem 10x15";
      btn.classList.add("baixar");
    }

    function baixarImagem() {
      const placa = document.getElementById('placaArea');
      
      // Renderiza em 4x (300 DPI) para impressão perfeita no acrílico
      html2canvas(placa, { 
        scale: 4, 
        useCORS: true, 
        logging: false 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'placa-google-10x15.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
      });
    }

    renderDark();
  </script>
</body>
</html>
